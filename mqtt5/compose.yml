version: '3.8'

services:
  mqtt5:
    image: eclipse-mosquitto:2.0.15
    container_name: mqtt5
    ports:
      - "1883:1883"
    volumes:
      - ./config:/mosquitto/config
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log
    restart: unless-stopped
    networks:
      - mqtt_net

networks:
  mqtt_net:
    driver: bridge